# Configurazione Classificatore Software

# Percorso database SQLite (relativo alla radice del progetto)
# Se assente, viene usato common.db_path() da config.yaml
db_path: "database/Enti_IT.db"

# Directory per i log
log_dir: "./logs"

# Threshold di confidenza per la classificazione finale
software_threshold: 0.65

# Threshold per l'uso della similarità semantica
semantic_threshold: 0.72

# Minimo campioni per classe (classi con meno campioni vengono rimosse)
min_samples_per_class: 3

# Modello per gli embeddings semantici
embedding_model: "paraphrase-multilingual-MiniLM-L12-v2"

# NUMERO MASSIMO DI RECORD DA CLASSIFICARE (0 = nessun limite)
max_run: 10