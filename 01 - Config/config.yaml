# Configurazione della pipeline.
#
# I percorsi relativi sono risolti rispetto alla radice del
# progetto (la cartella che contiene common.py), quindi qui
# si scrive "database/Enti_IT.db" e non "../database/...".
# Vedi common.resolve() per i dettagli.

# Database SQLite di lavoro
database_name: database/Enti_IT.db

# Cartella base dei file di input elencati in `files` e `files_enti`
input_dir: 00 - Input

# Numero massimo di record elaborati per run
max_run: 500

# Tabelle che devono esistere TUTTE perche' un ente entri nel
# calcolo ISDC. Un ente privo di una di queste non viene valutato:
# il suo punteggio sarebbe il valore neutro di apply_coverage
# (42.40, "Dipendenza infrastrutturale"), indistinguibile da una
# misura reale, e la coda di isdc.py e' incrementale, quindi non
# verrebbe piu' ricalcolato.
# Elenco vuoto: nessun controllo (solo debug).
isdc_required_tables:
  - enti_mx
  - enti_ns
  - enti_cname

# Tabelle anagrafiche caricate da LoadTable.py
# {chiave: nome tabella} / {chiave: nome file excel}
files:
  mxmap: comuni_mxmap_it_dataset.xlsx
  datacenter: italy_datacenters.xlsx
  comuni_contatti: comuni_contatti.xlsx
  comuni_lista: comuni_lista.xlsx
  comuni_cap: comuni_cap.xlsx
  enti_categorie: enti_categorie.xlsx
  enti_rtd: enti_rtd.xlsx

# Tabella enti caricate da LoadTableEnti.py
files_enti:
  enti_contatti: enti_contatti.xlsx
